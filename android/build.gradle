buildscript {
    // Legacy KGP is only needed if app explicitly declares android.builtInKotlin=false
    def isLegacyKotlin = project.rootProject.hasProperty("android.builtInKotlin") &&
        !project.rootProject.property("android.builtInKotlin").toString().toBoolean()

    def kotlinVer = project.rootProject.hasProperty('kotlin_version') ?
        project.rootProject.property('kotlin_version') : '1.8.22'

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.0'
        if (isLegacyKotlin) {
            classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVer"
        }
    }
}

// Default to Built-in Kotlin (true) for modern Flutter / AGP 9.0+,
// unless the app explicitly sets android.builtInKotlin=false in gradle.properties
def builtInKotlin = project.rootProject.hasProperty("android.builtInKotlin") ?
    project.rootProject.property("android.builtInKotlin").toString().toBoolean() :
    true

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

// Only apply KGP for legacy Flutter / AGP < 9 when built-in Kotlin is disabled
if (!builtInKotlin) {
    apply plugin: 'kotlin-android'
}

android {
    if (project.android.hasProperty('namespace')) { 
        namespace 'com.byneapp.flutter_config'
    }
    
    compileSdk 35
    buildFeatures.buildConfig true
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    if (!builtInKotlin) {
        kotlinOptions {
            jvmTarget = '17'
        }
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }
    defaultConfig {
        minSdkVersion 16
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
    }
    lintOptions {
        disable 'InvalidPackage'
    }

    dependencies {
        testImplementation("org.jetbrains.kotlin:kotlin-test")
        testImplementation("org.mockito:mockito-core:5.0.0")
    }
}

// Configure compilerOptions for Built-in Kotlin (Flutter 3.47+ / AGP 9.0+)
if (builtInKotlin) {
    try {
        kotlin {
            compilerOptions {
                jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
            }
        }
    } catch (Throwable ignored) {
        // Fallback if DSL differs across AGP milestones
    }
}
